<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Pie vs Bar</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls" id="btns"></div>
  <div class="d-stats" id="stats"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const ITEMS = [
  ['搜索', 'Search', 34], ['社交', 'Social', 27], ['视频', 'Video', 21],
  ['购物', 'Shopping', 12], ['其他', 'Others', 6]
].map(d => ({ zh: d[0], en: d[1], v: d[2] }));
const total = d3.sum(ITEMS, d => d.v);
const VIEWS = [{ k: 'pie', zh: '饼图', en: 'Pie' }, { k: 'bar', zh: '条形图', en: 'Bar' }];
let view = 'pie';

const btns = document.getElementById('btns');
VIEWS.forEach(function (v, i) {
  const b = document.createElement('button');
  b.className = 'd-btn' + (i === 0 ? ' on' : '');
  b.textContent = L(v.zh, v.en);
  b.onclick = function () { view = v.k; draw(); };
  btns.appendChild(b);
});
document.getElementById('stats').innerHTML =
  '<span>' + L('合计', 'Total') + ' <b>' + total + '</b></span>' +
  '<span>' + L('第 2 大 与 第 1 大之差', 'Gap between 1st and 2nd') + ' <b>' +
  (ITEMS[0].v - ITEMS[1].v) + '</b></span>';
document.getElementById('hint').innerHTML =
  L('<b>提示：</b>切换两种视图，比较"哪一类最大、第二大类与最大类差多少"的判断难度。角度与面积的精度都低于长度。',
    '<b>Tip:</b> switch views and compare how hard it is to tell which slice is largest and how far the second is behind. Angle and area are less accurate than length.');

function draw() {
  d3.selectAll('#btns .d-btn').classed('on', (d, i) => VIEWS[i].k === view);
  const c = canvas('#chart', 244, { top: 12, right: 14, bottom: 22, left: 14 });
  const name = d => d[window.DEMO_LANG === 'en' ? 'en' : 'zh'];
  const T = window.tip('.wrap');
  const color = d3.scaleOrdinal().domain(ITEMS.map(name))
    .range(['#4f46e5', '#6366f1', '#818cf8', '#a5b4fc', '#c7d2fe']);

  if (view === 'pie') {
    const R0 = Math.min(c.w / 2.4, c.h / 2) - 6;
    const g = c.g.append('g').attr('transform', 'translate(' + c.w / 2 + ',' + c.h / 2 + ')');
    const pie = d3.pie().sort(null).value(d => d.v)(ITEMS);
    const arc = d3.arc().innerRadius(0).outerRadius(R0);
    const arcBig = d3.arc().innerRadius(0).outerRadius(R0 + 7);

    g.selectAll('path').data(pie).join('path')
      .attr('fill', d => color(name(d.data)))
      .attr('stroke', '#fff').attr('stroke-width', 2)
      .style('cursor', 'pointer')
      .transition().duration(600).attrTween('d', function (d) {
        const i = d3.interpolate({ startAngle: 0, endAngle: 0 }, d);
        return t => arc(i(t));
      })
      .selection()
      .on('mouseover', function (e, d) {
        d3.select(this).transition().duration(150).attr('d', arcBig);
        T.show(name(d.data) + ' <b>' + d.data.v + '</b> · ' + fmt(d.data.v / total * 100, 1) + '%', e);
      })
      .on('mousemove', e => T.move(e))
      .on('mouseout', function () {
        d3.select(this).transition().duration(150).attr('d', arc); T.hide();
      });

    g.selectAll('text').data(pie).join('text')
      .attr('transform', d => 'translate(' + arc.centroid(d) + ')')
      .attr('text-anchor', 'middle').style('font-size', '10px')
      .style('fill', (d, i) => i > 2 ? '#3f3f46' : '#fff')
      .text(d => fmt(d.data.v / total * 100, 0) + '%');

    const legend = c.g.append('g').attr('transform', 'translate(0,' + (c.h - 4) + ')');
    let ox = 0;
    ITEMS.forEach(function (d) {
      const gg = legend.append('g');
      gg.append('rect').attr('x', ox).attr('y', -8).attr('width', 9).attr('height', 9)
        .attr('rx', 2).attr('fill', color(name(d)));
      gg.append('text').attr('x', ox + 13).attr('y', 0)
        .style('font-size', '10px').style('fill', '#8a8a93').text(name(d));
      ox += 13 + (window.DEMO_LANG === 'en' ? name(d).length * 6.2 : name(d).length * 11) + 12;
    });
  } else {
    const x = d3.scaleBand().domain(ITEMS.map(name)).range([0, c.w]).padding(0.35);
    const y = d3.scaleLinear().domain([0, d3.max(ITEMS, d => d.v)]).nice().range([c.h - 16, 0]);
    c.g.append('g').attr('class', 'grid')
      .call(d3.axisLeft(y).ticks(5).tickSize(-c.w).tickFormat(''));
    c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + (c.h - 16) + ')')
      .call(d3.axisBottom(x).tickSizeOuter(0));
    c.g.append('g').attr('class', 'axis').call(d3.axisLeft(y).ticks(5).tickSizeOuter(0));
    c.g.selectAll('rect').data(ITEMS).join('rect')
      .attr('x', d => x(name(d))).attr('width', x.bandwidth())
      .attr('y', c.h - 16).attr('height', 0).attr('fill', d => color(name(d)))
      .style('cursor', 'pointer')
      .on('mouseover', function (e, d) {
        d3.select(this).attr('fill', '#16161a');
        T.show(name(d) + ' <b>' + d.v + '</b> · ' + fmt(d.v / total * 100, 1) + '%', e);
      })
      .on('mousemove', e => T.move(e))
      .on('mouseout', function (d) { d3.select(this).attr('fill', color(name(d))); T.hide(); })
      .transition().duration(650)
      .attr('y', d => y(d.v)).attr('height', d => c.h - 16 - y(d.v));
  }
}
draw();
</script>
</body>
</html>
