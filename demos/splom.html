<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Scatterplot Matrix</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls"><span class="d-label" id="lb"></span></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(41);
const gauss = () => (R() + R() + R() + R() - 2) * 0.7;
const DIMS = [
  ['花萼长', 'Sepal L.', 5.8, 0.9], ['花萼宽', 'Sepal W.', 3.0, 0.5],
  ['花瓣长', 'Petal L.', 3.8, 1.8], ['花瓣宽', 'Petal W.', 1.2, 0.8]
];
const SPECIES = [['山鸢尾', 'Setosa'], ['变色鸢尾', 'Versicolor'], ['维吉尼亚', 'Virginica']];
const OFF = [[0, 0], [1.5, -0.4], [2.6, 0.5]];

const data = [];
SPECIES.forEach(function (s, si) {
  for (let i = 0; i < 48; i++) {
    const row = { sp: si };
    DIMS.forEach(function (d, k) {
      row['d' + k] = d[2] + OFF[si][0] * (k % 2 === 0 ? 1 : -0.5) * (0.6 + k * 0.2) + gauss() * d[3];
    });
    data.push(row);
  }
});
const color = d3.scaleOrdinal().range(['#4f46e5', '#0f766e', '#f59e0b']);
let big = null;

document.getElementById('lb').textContent = L('点击任意单元格放大', 'Click a cell to enlarge');
document.getElementById('hint').innerHTML =
  L('<b>提示：</b>散点图矩阵不降维，因此不损失信息。对角线上方与下方互为转置，观察花瓣长与花瓣宽的组合最能区分三个类别。',
    '<b>Tip:</b> a scatterplot matrix performs no reduction, so no information is lost. Upper and lower triangles are transposes; petal length against petal width separates the three species best.');

function draw() {
  const c = canvas('#chart', 296, { top: 8, right: 8, bottom: 8, left: 8 });
  const n = DIMS.length;
  const pad = 6;
  const cell = Math.min((c.w - (n - 1) * pad) / n, (c.h - (n - 1) * pad) / n);
  const x = {}, y = {};
  DIMS.forEach(function (d, k) {
    x[k] = d3.scaleLinear().domain(d3.extent(data, r => r['d' + k])).nice().range([2, cell - 2]);
    y[k] = d3.scaleLinear().domain(d3.extent(data, r => r['d' + k])).nice().range([cell - 2, 2]);
  });

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const g = c.g.append('g')
        .attr('transform', 'translate(' + j * (cell + pad) + ',' + i * (cell + pad) + ')');
      g.append('rect').attr('width', cell).attr('height', cell)
        .attr('fill', '#fafafa').attr('stroke', '#eeeef0');

      if (i === j) {
        g.append('text').attr('x', cell / 2).attr('y', cell / 2 + 3)
          .attr('text-anchor', 'middle').style('font-size', '10px')
          .style('fill', '#8a8a93').text(DIMS[i][window.DEMO_LANG === 'en' ? 1 : 0]);
      } else {
        g.selectAll('circle').data(data).join('circle')
          .attr('cx', r => x[j](r['d' + j])).attr('cy', r => y[i](r['d' + i]))
          .attr('r', 1.7).attr('fill', r => color(r.sp)).attr('fill-opacity', 0.62);
        g.append('rect').attr('width', cell).attr('height', cell)
          .attr('fill', 'transparent').style('cursor', 'pointer')
          .on('click', function () { big = [j, i]; draw(); })
          .append('title').text(L('点击放大', 'Click to enlarge'));
      }
      if (i === n - 1) {
        g.append('text').attr('x', cell / 2).attr('y', cell + 9)
          .attr('text-anchor', 'middle').style('font-size', '9px').style('fill', '#c7c7cc')
          .text(DIMS[j][window.DEMO_LANG === 'en' ? 1 : 0]);
      }
    }
  }

  if (big) {
    const [j, i] = big;
    const W = c.w * 0.62, H = c.h * 0.72;
    const ov = c.g.append('g')
      .attr('transform', 'translate(' + (c.w - W) / 2 + ',' + (c.h - H) / 2 + ')');
    ov.append('rect').attr('x', -6).attr('y', -6).attr('width', W + 12).attr('height', H + 12)
      .attr('fill', '#fff').attr('stroke', '#d4d4d8').attr('rx', 8);
    const bx = d3.scaleLinear().domain(x[j].domain()).range([0, W]);
    const by = d3.scaleLinear().domain(y[i].domain()).range([H, 0]);
    ov.append('g').attr('class', 'grid')
      .call(d3.axisLeft(by).ticks(5).tickSize(-W).tickFormat(''));
    ov.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + H + ')')
      .call(d3.axisBottom(bx).ticks(5).tickSizeOuter(0));
    ov.append('g').attr('class', 'axis').call(d3.axisLeft(by).ticks(5).tickSizeOuter(0));
    ov.selectAll('circle').data(data).join('circle')
      .attr('cx', r => bx(r['d' + j])).attr('cy', r => by(r['d' + i]))
      .attr('r', 3).attr('fill', r => color(r.sp)).attr('fill-opacity', 0.7);
    ov.append('text').attr('x', W / 2).attr('y', -12).attr('text-anchor', 'middle')
      .style('font-size', '11px').style('fill', '#16161a')
      .text(DIMS[j][window.DEMO_LANG === 'en' ? 1 : 0] + ' × ' + DIMS[i][window.DEMO_LANG === 'en' ? 1 : 0]);
    ov.append('text').attr('x', W - 4).attr('y', 14).attr('text-anchor', 'end')
      .style('font-size', '10px').style('fill', '#4f46e5').style('cursor', 'pointer')
      .text('✕ ' + L('关闭', 'close')).on('click', function () { big = null; draw(); });
  }
}
draw();
</script>
</body>
</html>
