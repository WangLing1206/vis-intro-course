<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Visual Channels</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls" id="btns"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
const VALUES = [42, 28, 55, 33, 61, 47];

const MODES = [
  { k: 'len', zh: '长度', en: 'Length',
    noteZh: '长度：条形端点对齐，差值一眼可辨，精度最高。',
    noteEn: 'Length: bar ends align, differences are obvious, accuracy is highest.' },
  { k: 'area', zh: '面积', en: 'Area',
    noteZh: '面积：半径需按平方根映射，读者容易低估较大的圆。',
    noteEn: 'Area: radius must follow a square root; readers underestimate larger circles.' },
  { k: 'angle', zh: '角度', en: 'Angle',
    noteZh: '角度：缺少共同基线，斜角比较精度明显低于长度。',
    noteEn: 'Angle: without a shared baseline, comparing slopes is far less accurate.' },
  { k: 'hue', zh: '色相', en: 'Hue',
    noteZh: '色相：适合区分类别，不适合表达数值大小。',
    noteEn: 'Hue: good for categories, poor for magnitude.' },
  { k: 'lum', zh: '明度', en: 'Lightness',
    noteZh: '明度：有天然的"由少到多"方向感，但仍难读出精确数值。',
    noteEn: 'Lightness: carries a natural sense of less to more, yet exact values stay hard to read.' }
];

let mode = 'len', showVal = false;
const btns = document.getElementById('btns');
MODES.forEach(function (m, i) {
  const b = document.createElement('button');
  b.className = 'd-btn' + (i === 0 ? ' on' : '');
  b.textContent = L(m.zh, m.en);
  b.onclick = function () { mode = m.k; draw(); };
  btns.appendChild(b);
});
const vb = document.createElement('button');
vb.className = 'd-btn';
vb.textContent = L('显示数值', 'Show values');
vb.onclick = function () { showVal = !showVal; this.classList.toggle('on', showVal); draw(); };
btns.appendChild(vb);

function draw() {
  d3.selectAll('#btns .d-btn').classed('on', function (d, i) {
    return i < MODES.length ? MODES[i].k === mode : showVal;
  });
  const m = MODES.find(k => k.k === mode);
  document.getElementById('hint').innerHTML = '<b>' + L(m.zh, m.en) + '</b> · ' + L(m.noteZh, m.noteEn);

  const c = canvas('#chart', 250, { top: 14, right: 16, bottom: 26, left: 16 });
  const data = LETTERS.map((l, i) => ({ l: l, v: VALUES[i] }));
  const max = d3.max(VALUES), min = d3.min(VALUES);

  function labels(xFn, yFn) {
    c.g.selectAll('text.lab').data(data).join('text').attr('class', 'lab')
      .attr('x', xFn).attr('y', yFn).attr('text-anchor', 'middle')
      .style('font-size', '10.5px').style('fill', '#8a8a93')
      .text(d => showVal ? d.l + ' ' + d.v : d.l);
  }

  if (mode === 'len') {
    const x = d3.scaleBand().domain(LETTERS).range([0, c.w]).padding(0.35);
    const y = d3.scaleLinear().domain([0, max]).range([c.h, 0]);
    c.g.selectAll('rect').data(data).join('rect')
      .attr('x', d => x(d.l)).attr('width', x.bandwidth())
      .attr('y', c.h).attr('height', 0).attr('fill', '#4f46e5')
      .transition().duration(600)
      .attr('y', d => y(d.v)).attr('height', d => c.h - y(d.v));
    labels(d => x(d.l) + x.bandwidth() / 2, c.h + 15);
  }

  if (mode === 'area') {
    const x = d3.scaleBand().domain(LETTERS).range([0, c.w]).padding(0.2);
    const r = d3.scaleSqrt().domain([0, max]).range([0, Math.min(x.bandwidth(), c.h) / 2]);
    c.g.selectAll('circle').data(data).join('circle')
      .attr('cx', d => x(d.l) + x.bandwidth() / 2).attr('cy', c.h / 2)
      .attr('r', 0).attr('fill', '#4f46e5').attr('fill-opacity', 0.85)
      .transition().duration(600).attr('r', d => r(d.v));
    labels(d => x(d.l) + x.bandwidth() / 2, c.h + 15);
  }

  if (mode === 'angle') {
    const pie = d3.pie().sort(null).value(d => d.v)(data);
    const R0 = Math.min(c.w / 3, c.h / 2) - 4;
    const arc = d3.arc().innerRadius(0).outerRadius(R0);
    const g = c.g.append('g').attr('transform', 'translate(' + c.w / 2 + ',' + (c.h / 2 - 6) + ')');
    g.selectAll('path').data(pie).join('path')
      .attr('fill', (d, i) => d3.interpolateGreys(0.15 + i * 0.13))
      .attr('stroke', '#fff').attr('stroke-width', 2)
      .transition().duration(600).attrTween('d', function (d) {
        const i = d3.interpolate({ startAngle: 0, endAngle: 0 }, d);
        return t => arc(i(t));
      });
    g.selectAll('text').data(pie).join('text')
      .attr('transform', d => 'translate(' + arc.centroid(d) + ')')
      .attr('text-anchor', 'middle').style('font-size', '10px').style('fill', '#52525b')
      .text(d => showVal ? d.data.l + ' ' + d.data.v : d.data.l);
  }

  if (mode === 'hue' || mode === 'lum') {
    const x = d3.scaleBand().domain(LETTERS).range([0, c.w]).padding(0.18);
    const t = d3.scaleLinear().domain([min, max]).range([0, 1]);
    c.g.selectAll('rect').data(data).join('rect')
      .attr('x', d => x(d.l)).attr('width', x.bandwidth())
      .attr('y', 10).attr('height', c.h - 10)
      .attr('fill', d => mode === 'hue'
        ? d3.hsl(230 - 210 * t(d.v), 0.62, 0.55)
        : d3.hsl(230, 0.55, 0.92 - 0.62 * t(d.v)))
      .attr('stroke', '#e6e6e9');
    labels(d => x(d.l) + x.bandwidth() / 2, c.h + 15);
  }
}
draw();
</script>
</body>
</html>
