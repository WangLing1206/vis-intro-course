<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Bar Chart</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls" id="btns"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const NAMES = [
  ['北京', 'Beijing'], ['上海', 'Shanghai'], ['广州', 'Guangzhou'], ['深圳', 'Shenzhen'],
  ['杭州', 'Hangzhou'], ['成都', 'Chengdu'], ['武汉', 'Wuhan'], ['西安', "Xi'an"],
  ['南京', 'Nanjing'], ['重庆', 'Chongqing']
];
const R = window.rnd(5);
const data = NAMES.map(function (n) {
  return { name: n, v: Math.round(28 + R() * 92) };
});

const SORTS = [
  { k: 'desc', zh: '数值降序', en: 'Value ↓' },
  { k: 'asc', zh: '数值升序', en: 'Value ↑' },
  { k: 'name', zh: '按名称', en: 'By name' }
];
let sort = 'desc';

const btns = document.getElementById('btns');
SORTS.forEach(function (s, i) {
  const b = document.createElement('button');
  b.className = 'd-btn' + (i === 0 ? ' on' : '');
  b.textContent = L(s.zh, s.en);
  b.onclick = function () { sort = s.k; draw(); };
  btns.appendChild(b);
});
document.getElementById('hint').innerHTML =
  L('<b>提示：</b>条形图用长度编码数值，是比较类别大小的首选；悬停查看数值，点击按钮切换排序并观察过渡动画。',
    '<b>Tip:</b> bar charts encode value by length and are the first choice for comparing categories. Hover to read values; click a button to re-sort and watch the transition.');

function draw() {
  d3.selectAll('#btns .d-btn').classed('on', (d, i) => SORTS[i].k === sort);
  const rows = data.slice().sort(function (a, b) {
    return sort === 'desc' ? b.v - a.v : sort === 'asc' ? a.v - b.v
      : a.name[0].localeCompare(b.name[0], 'zh');
  });

  const c = canvas('#chart', 252, { top: 10, right: 46, bottom: 22, left: 62 });
  const x = d3.scaleLinear().domain([0, d3.max(data, d => d.v)]).nice().range([0, c.w]);
  const y = d3.scaleBand().domain(rows.map(d => d.name[window.DEMO_LANG === 'en' ? 1 : 0]))
    .range([0, c.h]).padding(0.28);

  c.g.append('g').attr('class', 'grid')
    .call(d3.axisBottom(x).ticks(5).tickSize(c.h).tickFormat(''));
  c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
    .call(d3.axisBottom(x).ticks(5).tickSizeOuter(0));
  c.g.append('g').attr('class', 'axis').call(d3.axisLeft(y).tickSizeOuter(0));

  const T = window.tip('.wrap');
  const key = d => d.name[window.DEMO_LANG === 'en' ? 1 : 0];

  c.g.selectAll('rect').data(rows, key).join(
    enter => enter.append('rect')
      .attr('x', 0).attr('y', d => y(key(d)))
      .attr('height', y.bandwidth()).attr('width', 0).attr('fill', '#4f46e5')
      .call(e => e.transition().duration(700).attr('width', d => x(d.v))),
    update => update.call(u => u.transition().duration(700)
      .attr('y', d => y(key(d))).attr('width', d => x(d.v)))
  ).on('mouseover', function (e, d) {
    d3.select(this).attr('fill', '#16161a');
    T.show(key(d) + ' · <b>' + d.v + '</b>', e);
  }).on('mousemove', e => T.move(e))
    .on('mouseout', function () { d3.select(this).attr('fill', '#4f46e5'); T.hide(); });

  c.g.selectAll('text.val').data(rows, key).join('text').attr('class', 'val')
    .attr('x', 6).attr('y', c.h + 16)
    .style('font-size', '10px').style('fill', '#8a8a93')
    .transition().duration(700)
    .attr('y', d => y(key(d)) + y.bandwidth() / 2 + 4)
    .attr('x', d => x(d.v) + 6)
    .text(d => d.v);
}
draw();
</script>
</body>
</html>
