<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Scales</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls" id="btns"></div>
  <div class="d-stats" id="stats"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(21);
const data = d3.range(18).map(function (i) {
  return { id: 'd' + (i + 1), v: Math.round(4 + Math.pow(R(), 3) * 320) };
});
const max = d3.max(data, d => d.v), min = d3.min(data, d => d.v);

const MODES = [
  { k: 'linear', zh: '线性', en: 'Linear',
    noteZh: '线性标度：等长代表等差，最容易被正确解读。',
    noteEn: 'Linear scale: equal length means equal difference, easiest to read correctly.' },
  { k: 'sqrt', zh: '平方根', en: 'Square root',
    noteZh: '平方根标度：用于面积编码，使面积而非直径与数值成正比。',
    noteEn: 'Square-root scale: used with area encoding so area, not radius, is proportional.' },
  { k: 'log', zh: '对数', en: 'Logarithmic',
    noteZh: '对数标度：跨越多个数量级时使用，定义域不能包含 0。',
    noteEn: 'Log scale: for values spanning orders of magnitude; the domain cannot contain zero.' },
  { k: 'pow', zh: '幂（指数 2）', en: 'Power (exp 2)',
    noteZh: '幂标度：放大高值区间的差异，小值被压缩。',
    noteEn: 'Power scale: magnifies differences among large values and compresses small ones.' }
];

let mode = 'linear';
const btns = document.getElementById('btns');
MODES.forEach(function (m, i) {
  const b = document.createElement('button');
  b.className = 'd-btn' + (i === 0 ? ' on' : '');
  b.textContent = L(m.zh, m.en);
  b.onclick = function () { mode = m.k; draw(); };
  btns.appendChild(b);
});
document.getElementById('stats').innerHTML =
  '<span>' + L('最小值', 'min') + ' <b>' + min + '</b></span>' +
  '<span>' + L('最大值', 'max') + ' <b>' + max + '</b></span>' +
  '<span>' + L('极值比', 'max / min') + ' <b>' + fmt(max / min, 1) + '</b></span>';

function draw() {
  d3.selectAll('#btns .d-btn').classed('on', (d, i) => MODES[i].k === mode);
  const m = MODES.find(k => k.k === mode);
  document.getElementById('hint').innerHTML = '<b>' + L(m.zh, m.en) + '</b> · ' + L(m.noteZh, m.noteEn);

  const c = canvas('#chart', 244, { top: 12, right: 12, bottom: 26, left: 40 });
  const x = d3.scaleBand().domain(data.map(d => d.id)).range([0, c.w]).padding(0.28);
  const y = mode === 'linear' ? d3.scaleLinear().domain([0, max]).nice().range([c.h, 0])
    : mode === 'sqrt' ? d3.scaleSqrt().domain([0, max]).range([c.h, 0])
    : mode === 'log' ? d3.scaleLog().domain([min, max]).range([c.h, 0])
    : d3.scalePow().exponent(2).domain([0, max]).range([c.h, 0]);

  c.g.append('g').attr('class', 'grid')
    .call(d3.axisLeft(y).ticks(5, mode === 'log' ? ',.0f' : undefined).tickSize(-c.w).tickFormat(''));
  c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
    .call(d3.axisBottom(x).tickSizeOuter(0).tickValues(x.domain().filter((d, i) => i % 2 === 0)));
  c.g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(y).ticks(5, mode === 'log' ? ',.0f' : undefined).tickSizeOuter(0));

  const T = window.tip('.wrap');
  c.g.selectAll('rect').data(data, d => d.id).join('rect')
    .attr('x', d => x(d.id)).attr('width', x.bandwidth())
    .attr('y', d => y(d.v)).attr('height', d => c.h - y(d.v))
    .attr('fill', '#4f46e5')
    .on('mouseover', function (e, d) {
      d3.select(this).attr('fill', '#16161a');
      T.show(d.id + ' · ' + L('数值', 'value') + ' <b>' + d.v + '</b>', e);
    })
    .on('mousemove', e => T.move(e))
    .on('mouseout', function () { d3.select(this).attr('fill', '#4f46e5'); T.hide(); });
}
draw();
</script>
</body>
</html>
