<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Line Chart</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="legend" id="legend"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(13);
const KEYS = [['东部', 'East'], ['中部', 'Central'], ['西部', 'West']];
const color = d3.scaleOrdinal().range(['#4f46e5', '#f59e0b', '#0f766e']);
const dates = d3.range(24).map(i => new Date(2024, i, 1));

const series = KEYS.map(function (k, s) {
  let base = 40 + s * 18;
  return {
    key: k,
    values: dates.map(function (d, i) {
      base += (R() - 0.5) * 9 + Math.sin(i / 3 + s) * 2.4;
      return { date: d, v: Math.max(8, base) };
    })
  };
});
const hidden = new Set();

const legendEl = document.getElementById('legend');
series.forEach(function (s) {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = '<span class="swatch" style="background:' + color(s.key[0]) + '"></span>' +
    '<span>' + s.key[window.DEMO_LANG === 'en' ? 1 : 0] + '</span>';
  item.onclick = function () {
    if (hidden.has(s.key[0])) hidden.delete(s.key[0]); else hidden.add(s.key[0]);
    this.classList.toggle('off', hidden.has(s.key[0]));
    draw();
  };
  legendEl.appendChild(item);
});

document.getElementById('hint').innerHTML =
  L('<b>提示：</b>折线图用水平位置编码时间、垂直位置编码数值，线段暗示连续变化。点击图例可隐藏序列，鼠标移入查看该月数值。',
    '<b>Tip:</b> line charts encode time horizontally and value vertically; segments imply continuity. Click the legend to toggle a series, hover to read monthly values.');

function draw() {
  const c = canvas('#chart', 250, { top: 12, right: 14, bottom: 24, left: 38 });
  const shown = series.filter(s => !hidden.has(s.key[0]));
  const all = shown.flatMap(s => s.values);
  const x = d3.scaleTime().domain(d3.extent(dates)).range([0, c.w]);
  const y = d3.scaleLinear().domain([0, d3.max(all, d => d.v)]).nice().range([c.h, 0]);

  c.g.append('g').attr('class', 'grid')
    .call(d3.axisLeft(y).ticks(5).tickSize(-c.w).tickFormat(''));
  c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
    .call(d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat('%-m月')).tickSizeOuter(0));
  c.g.append('g').attr('class', 'axis').call(d3.axisLeft(y).ticks(5).tickSizeOuter(0));

  const line = d3.line().x(d => x(d.date)).y(d => y(d.v)).curve(d3.curveMonotoneX);

  const paths = c.g.selectAll('path.line').data(shown, d => d.key[0]).join('path')
    .attr('class', 'line').attr('fill', 'none')
    .attr('stroke', d => color(d.key[0])).attr('stroke-width', 2)
    .attr('stroke-linejoin', 'round').attr('d', d => line(d.values));

  paths.each(function () {
    const len = this.getTotalLength();
    d3.select(this).attr('stroke-dasharray', len + ' ' + len)
      .attr('stroke-dashoffset', len)
      .transition().duration(900).ease(d3.easeCubicOut).attr('stroke-dashoffset', 0);
  });

  const focus = c.g.append('line').attr('y1', 0).attr('y2', c.h)
    .attr('stroke', '#16161a').attr('stroke-opacity', 0.35)
    .attr('stroke-dasharray', '3 3').style('display', 'none');
  const T = window.tip('.wrap');
  const marks = c.g.selectAll('circle.mk').data(shown).join('circle')
    .attr('class', 'mk').attr('r', 4).attr('fill', d => color(d.key[0]))
    .attr('stroke', '#fff').attr('stroke-width', 1.5).style('display', 'none');

  c.g.append('rect').attr('width', c.w).attr('height', c.h).attr('fill', 'transparent')
    .on('mouseover', function () { focus.style('display', null); marks.style('display', null); })
    .on('mouseout', function () { focus.style('display', 'none'); marks.style('display', 'none'); T.hide(); })
    .on('mousemove', function (e) {
      const mx = d3.pointer(e)[0];
      const date = x.invert(mx);
      const i = d3.bisector(d => d.date).center(dates, date);
      focus.attr('x1', x(dates[i])).attr('x2', x(dates[i]));
      marks.attr('cx', x(dates[i])).attr('cy', d => y(d.values[i].v));
      const label = d3.timeFormat(L('%Y年%-m月', '%b %Y'))(dates[i]);
      T.show('<b>' + label + '</b><br>' + shown.map(s =>
        s.key[window.DEMO_LANG === 'en' ? 1 : 0] + ' ' + fmt(s.values[i].v, 1)).join('<br>'), e);
    });
}
draw();
</script>
</body>
</html>
