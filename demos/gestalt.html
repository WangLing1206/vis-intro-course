<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Gestalt Principles</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const PANELS = [
  { zh: '接近性', en: 'Proximity',
    noteZh: '空间上靠近的元素被看成同一组，无需任何边框。',
    noteEn: 'Elements close in space are seen as one group, without any border.' },
  { zh: '相似性', en: 'Similarity',
    noteZh: '颜色相同的元素被看成同类，即使它们相距很远。',
    noteEn: 'Elements sharing a color are seen as one kind, even far apart.' },
  { zh: '闭合性', en: 'Closure',
    noteZh: '不连续的轮廓仍被感知为一个完整形状。',
    noteEn: 'A broken contour is still perceived as one complete shape.' },
  { zh: '连续性', en: 'Continuity',
    noteZh: '交叉的线条中，人们倾向沿平滑方向追踪。',
    noteEn: 'Among crossing lines, people follow the smoother direction.' }
];

document.getElementById('hint').innerHTML =
  L('<b>提示：</b>把鼠标移到任意元素上，同组元素会被高亮，其余自动淡出。',
    '<b>Tip:</b> hover any element: its group is highlighted and the rest fade out.');

const c = canvas('#chart', 300, { top: 14, right: 10, bottom: 10, left: 10 });
const pw = c.w / 2, ph = c.h / 2;
const R = window.rnd(11);

PANELS.forEach(function (p, i) {
  const g = c.g.append('g').attr('transform', 'translate(' + (i % 2) * pw + ',' + Math.floor(i / 2) * ph + ')');
  g.append('text').attr('x', 4).attr('y', 12)
    .style('font-size', '11px').style('fill', '#16161a').style('font-weight', 600)
    .text((i + 1) + '. ' + L(p.zh, p.en));
  g.append('title').text(L(p.noteZh, p.noteEn));

  const inner = g.append('g').attr('transform', 'translate(0,18)');
  const areaW = pw - 14, areaH = ph - 30;

  function hoverable(sel) {
    sel.on('mouseover', function () {
      const key = this.getAttribute('data-g');
      inner.selectAll('[data-g]').attr('opacity', function () {
        return this.getAttribute('data-g') === key ? 1 : 0.18;
      });
    }).on('mouseout', function () {
      inner.selectAll('[data-g]').attr('opacity', 1);
    });
  }

  if (i === 0) {
    const pts = [];
    [0, 1, 2].forEach(function (k) {
      for (let j = 0; j < 8; j++) {
        pts.push({ g: 'g' + k, x: 20 + k * (areaW / 3) + R() * 16, y: 12 + R() * (areaH - 20) });
      }
    });
    hoverable(inner.selectAll('circle').data(pts).join('circle')
      .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', 3.4)
      .attr('fill', '#16161a').attr('data-g', d => d.g).style('cursor', 'pointer'));
  }

  if (i === 1) {
    const pts = [];
    for (let r = 0; r < 5; r++) {
      for (let col = 0; col < 6; col++) {
        pts.push({ g: 'g' + (col % 2), x: 22 + col * 20, y: 12 + r * 17 });
      }
    }
    hoverable(inner.selectAll('circle').data(pts).join('circle')
      .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', 4.2)
      .attr('fill', d => d.g === 'g0' ? '#4f46e5' : '#c7c7cc')
      .attr('data-g', d => d.g).style('cursor', 'pointer'));
  }

  if (i === 2) {
    const arcs = [
      { a0: 0.15, a1: 1.9 }, { a0: 2.25, a1: 4.0 }, { a0: 4.35, a1: 6.1 }
    ];
    const arc = d3.arc().innerRadius(20).outerRadius(23);
    hoverable(inner.selectAll('path').data(arcs).join('path')
      .attr('transform', 'translate(' + (areaW / 2 - 10) + ',' + (areaH / 2 + 4) + ')')
      .attr('d', d => arc({ startAngle: d.a0, endAngle: d.a1, innerRadius: 20, outerRadius: 23 }))
      .attr('fill', '#16161a').attr('data-g', 'c').style('cursor', 'pointer'));
    inner.append('circle').attr('cx', areaW / 2 - 10).attr('cy', areaH / 2 + 4)
      .attr('r', 5).attr('fill', '#4f46e5').attr('data-g', 'c');
  }

  if (i === 3) {
    const x0 = 10, x1 = areaW - 10;
    const line = d3.line().curve(d3.curveBasis);
    const a = d3.range(6).map(k => [x0 + k * (x1 - x0) / 5, 14 + Math.sin(k * 0.9) * 12]);
    const b = d3.range(6).map(k => [x0 + k * (x1 - x0) / 5, 40 + Math.cos(k * 0.9) * 12]);
    hoverable(inner.append('path').datum(a).attr('d', line)
      .attr('fill', 'none').attr('stroke', '#4f46e5').attr('stroke-width', 2.4)
      .attr('data-g', 'A').style('cursor', 'pointer'));
    hoverable(inner.append('path').datum(b).attr('d', line)
      .attr('fill', 'none').attr('stroke', '#16161a').attr('stroke-width', 2.4)
      .attr('data-g', 'B').style('cursor', 'pointer'));
  }
});
</script>
</body>
</html>
