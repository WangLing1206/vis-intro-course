<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Force-Directed Graph</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls">
    <span class="d-label" id="lb"></span>
    <button class="d-btn" id="restart"></button>
  </div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(17);
const GROUPS = [['前端', 'Frontend'], ['后端', 'Backend'], ['数据', 'Data'], ['算法', 'Algorithm']];
const nodes = d3.range(46).map(function (i) {
  return { id: 'n' + i, group: Math.floor(R() * 4), r: 4 + R() * 5, deg: 0 };
});
const links = [];
nodes.forEach(function (n, i) {
  const m = 1 + Math.floor(R() * 2);
  for (let k = 0; k < m; k++) {
    const j = Math.floor(R() * nodes.length);
    if (j !== i && (R() < 0.72 || nodes[j].group === n.group)) {
      if (!links.some(l => (l.source === i && l.target === j) || (l.source === j && l.target === i))) {
        links.push({ source: i, target: j });
        n.deg++;
      }
    }
  }
});
const color = d3.scaleOrdinal().range(['#4f46e5', '#0f766e', '#f59e0b', '#be185d']);

document.getElementById('lb').textContent = L('节点 ' + nodes.length + ' · 边 ' + links.length,
  nodes.length + ' nodes · ' + links.length + ' edges');
document.getElementById('restart').textContent = L('重新布局', 'Re-layout');
document.getElementById('restart').onclick = draw;
document.getElementById('hint').innerHTML =
  L('<b>提示：</b>力导向布局把边看作弹簧、把节点看作互斥电荷。拖动任意节点观察系统重新收敛；点击节点可高亮它的邻居。',
    '<b>Tip:</b> a force layout treats edges as springs and nodes as repelling charges. Drag a node and watch the system re-converge; click a node to highlight its neighbors.');

function draw() {
  const c = canvas('#chart', 296, { top: 10, right: 10, bottom: 10, left: 10 });
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).distance(46).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-150))
    .force('center', d3.forceCenter(c.w / 2, c.h / 2))
    .force('collide', d3.forceCollide().radius(d => d.r + 3));

  const link = c.g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', '#c7c7cc').attr('stroke-opacity', 0.65)
    .attr('stroke-width', d => 0.8 + Math.min(d.source.deg, d.target.deg) * 0.12);

  const node = c.g.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r', d => d.r).attr('fill', d => color(d.group))
    .attr('stroke', '#fff').attr('stroke-width', 1.2).style('cursor', 'pointer');

  const T = window.tip('.wrap');
  let focusId = null;

  node.on('mouseover', function (e, d) {
    T.show(L('组 ' + GROUPS[d.group][0], GROUPS[d.group][1]) + ' · ' +
      L('连接度', 'degree') + ' <b>' + d.deg + '</b>', e);
  }).on('mousemove', e => T.move(e)).on('mouseout', () => T.hide())
    .on('click', function (e, d) {
      focusId = focusId === d.id ? null : d.id;
      highlight();
    })
    .call(d3.drag()
      .on('start', function (e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', function (e, d) { d.fx = e.x; d.fy = e.y; })
      .on('end', function (e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  function highlight() {
    if (!focusId) {
      node.attr('opacity', 1).attr('stroke', '#fff');
      link.attr('stroke', '#c7c7cc').attr('stroke-opacity', 0.65);
      return;
    }
    const near = new Set([focusId]);
    links.forEach(l => {
      if (l.source.id === focusId) near.add(l.target.id);
      if (l.target.id === focusId) near.add(l.source.id);
    });
    node.attr('opacity', d => near.has(d.id) ? 1 : 0.15)
      .attr('stroke', d => d.id === focusId ? '#16161a' : '#fff');
    link.attr('stroke', l => (l.source.id === focusId || l.target.id === focusId) ? '#4f46e5' : '#c7c7cc')
      .attr('stroke-opacity', l => (l.source.id === focusId || l.target.id === focusId) ? 0.95 : 0.12);
  }

  sim.on('tick', function () {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('cx', d => Math.max(d.r, Math.min(c.w - d.r, d.x)))
      .attr('cy', d => Math.max(d.r, Math.min(c.h - d.r, d.y)));
  });

  const legend = c.g.append('g').attr('transform', 'translate(2,' + (c.h - 2) + ')');
  let ox = 0;
  GROUPS.forEach(function (g, i) {
    legend.append('rect').attr('x', ox).attr('y', -9).attr('width', 9).attr('height', 9)
      .attr('rx', 2).attr('fill', color(i));
    legend.append('text').attr('x', ox + 13).attr('y', 0)
      .style('font-size', '10px').style('fill', '#8a8a93').text(g[window.DEMO_LANG === 'en' ? 1 : 0]);
    ox += 13 + (window.DEMO_LANG === 'en' ? g[1].length * 6.2 : g[0].length * 11) + 12;
  });
}
draw();
</script>
</body>
</html>
