<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Visualization Pipeline</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls" id="stages"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(7);
const data = d3.range(12).map(function (i) {
  return { id: 'r' + (i + 1), v: Math.round(R() * 90 + 8), bad: i === 3 || i === 9 };
});

const STAGES = [
  { zh: '原始数据', en: 'Raw Data',
    tipZh: '采集得到的记录，含缺失与异常，尚不可直接绘制。',
    tipEn: 'Records as collected, with gaps and outliers; not drawable yet.' },
  { zh: '清洗变换', en: 'Clean & Transform',
    tipZh: '标记异常值、填补缺失，得到规整的数值序列。',
    tipEn: 'Outliers flagged, gaps filled, producing a tidy numeric series.' },
  { zh: '可视化编码', en: 'Visual Encoding',
    tipZh: '把数值映射为长度：这一步只决定图形，不决定外观。',
    tipEn: 'Values mapped to length: this step fixes geometry, not appearance.' },
  { zh: '渲染绘制', en: 'Rendering',
    tipZh: '加上坐标轴、网格、配色与标注，图形开始可解读。',
    tipEn: 'Axes, gridlines, color, and labels are added; the chart becomes readable.' },
  { zh: '交互探索', en: 'Interaction',
    tipZh: '支持悬停查看与点击排序，用户可以自己提问。',
    tipEn: 'Hover and click-to-sort let users ask their own questions.' }
];

let stage = 0;
const stagesEl = document.getElementById('stages');
STAGES.forEach(function (s, i) {
  const b = document.createElement('button');
  b.className = 'd-btn' + (i === 0 ? ' on' : '');
  b.textContent = (i + 1) + ' · ' + L(s.zh, s.en);
  b.onclick = function () { stage = i; draw(); };
  stagesEl.appendChild(b);
});

function draw() {
  d3.selectAll('#stages .d-btn').classed('on', (d, i) => i === stage);
  const s = STAGES[stage];
  document.getElementById('hint').innerHTML = '<b>' + (stage + 1) + '/5</b> · ' + L(s.tipZh, s.tipEn);

  const c = canvas('#chart', 250, { top: 14, right: 14, bottom: 26, left: 34 });
  const shown = data.filter(d => stage >= 1 ? !d.bad || stage === 1 : true);

  if (stage < 2) {
    const rows = c.g.selectAll('g.row').data(data).join('g')
      .attr('class', 'row')
      .attr('transform', (d, i) => 'translate(0,' + (i * (c.h / data.length)) + ')');
    rows.append('text').attr('x', 0).attr('y', 11)
      .style('font-family', '"SF Mono",Consolas,monospace').style('font-size', '10.5px')
      .style('fill', d => (stage === 1 && d.bad) ? '#c7c7cc' : '#3f3f46')
      .text(d => d.id + ' , ' + (stage === 1 && d.bad ? 'NaN' : d.v));
    if (stage === 1) {
      rows.append('text').attr('x', 110).attr('y', 11)
        .style('font-size', '10px').style('fill', '#c7c7cc')
        .text(d => d.bad ? L('← 已剔除', '← removed') : '');
    }
    return;
  }

  const x = d3.scaleBand().domain(shown.map(d => d.id)).range([0, c.w]).padding(0.3);
  const y = d3.scaleLinear().domain([0, 100]).range([c.h, 0]);

  if (stage >= 3) {
    c.g.append('g').attr('class', 'grid')
      .call(d3.axisLeft(y).ticks(5).tickSize(-c.w).tickFormat(''));
    c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
      .call(d3.axisBottom(x).tickSizeOuter(0));
    c.g.append('g').attr('class', 'axis').call(d3.axisLeft(y).ticks(5).tickSizeOuter(0));
  }

  const bars = c.g.selectAll('rect').data(shown, d => d.id).join('rect')
    .attr('x', d => x(d.id)).attr('width', x.bandwidth())
    .attr('y', c.h).attr('height', 0)
    .attr('fill', stage >= 3 ? '#4f46e5' : '#16161a')
    .style('cursor', stage === 4 ? 'pointer' : 'default');

  bars.transition().duration(650)
    .attr('y', d => y(d.v)).attr('height', d => c.h - y(d.v));

  if (stage >= 3) {
    c.g.selectAll('text.lab').data(shown).join('text').attr('class', 'lab')
      .attr('x', d => x(d.id) + x.bandwidth() / 2).attr('y', d => y(d.v) - 5)
      .attr('text-anchor', 'middle').style('font-size', '9.5px').style('fill', '#8a8a93')
      .text(d => d.v);
  }

  if (stage === 4) {
    const T = window.tip('.wrap');
    bars.on('mouseover', function (e, d) {
      d3.select(this).attr('fill', '#16161a');
      T.show(d.id + ' · ' + L('数值', 'value') + ' <b>' + d.v + '</b>', e);
    }).on('mousemove', e => T.move(e))
      .on('mouseout', function () { d3.select(this).attr('fill', '#4f46e5'); T.hide(); })
      .on('click', function (e, d) {
        shown.sort((a, b) => b.v - a.v);
        x.domain(shown.map(k => k.id));
        c.g.select('.axis').transition().duration(500).call(d3.axisBottom(x).tickSizeOuter(0));
        bars.transition().duration(500).attr('x', k => x(k.id));
        c.g.selectAll('text.lab').transition().duration(500)
          .attr('x', k => x(k.id) + x.bandwidth() / 2);
      });
  }
}
draw();
</script>
</body>
</html>
