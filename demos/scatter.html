<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Scatter Plot</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls">
    <span class="d-label" id="lb"></span>
    <button class="d-btn" id="reset"></button>
  </div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(31);
const gauss = () => (R() + R() + R() + R() - 2) * 0.8;
const data = d3.range(320).map(function (i) {
  const x = 50 + gauss() * 15;
  return { id: i, x: x, y: 12 + x * 0.62 + gauss() * 9 };
});

let picked = new Set(data.map(d => d.id));
document.getElementById('lb').textContent = L('在图中拖出选框过滤数据', 'Drag a rectangle to filter');
document.getElementById('reset').textContent = L('重置选择', 'Reset');
document.getElementById('reset').onclick = function () {
  picked = new Set(data.map(d => d.id)); draw();
};
document.getElementById('hint').innerHTML =
  L('<b>提示：</b>散点图用两个位置通道表达相关性。框选后，右侧直方图与顶部计数同步更新——这就是"过滤"型交互。',
    '<b>Tip:</b> a scatter plot uses two position channels to show correlation. After brushing, the histogram and the counter update together: a filtering interaction.');

function draw() {
  const c = canvas('#chart', 258, { top: 16, right: 12, bottom: 28, left: 38 });
  const gw = c.w * 0.68, hw = c.w * 0.26, gap = c.w * 0.06;
  const x = d3.scaleLinear().domain(d3.extent(data, d => d.x)).nice().range([0, gw]);
  const y = d3.scaleLinear().domain(d3.extent(data, d => d.y)).nice().range([c.h, 0]);

  c.g.append('g').attr('class', 'grid')
    .call(d3.axisLeft(y).ticks(5).tickSize(-gw).tickFormat(''));
  c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
    .call(d3.axisBottom(x).ticks(6).tickSizeOuter(0));
  c.g.append('g').attr('class', 'axis').call(d3.axisLeft(y).ticks(5).tickSizeOuter(0));
  c.g.append('text').attr('x', gw - 4).attr('y', c.h + 26).attr('text-anchor', 'end')
    .style('font-size', '10px').style('fill', '#8a8a93').text(L('自变量 x', 'x'));

  const T = window.tip('.wrap');
  const dots = c.g.append('g').selectAll('circle').data(data).join('circle')
    .attr('cx', d => x(d.x)).attr('cy', d => y(d.y)).attr('r', 3.2)
    .attr('fill', d => picked.has(d.id) ? '#4f46e5' : '#d4d4d8')
    .attr('fill-opacity', 0.72)
    .on('mouseover', function (e, d) {
      d3.select(this).attr('r', 5).attr('fill-opacity', 1);
      T.show('x <b>' + fmt(d.x, 1) + '</b> · y <b>' + fmt(d.y, 1) + '</b>', e);
    })
    .on('mousemove', e => T.move(e))
    .on('mouseout', function () { d3.select(this).attr('r', 3.2).attr('fill-opacity', 0.72); T.hide(); });

  /* 右侧：选中数据的 y 值直方图 */
  const bins = d3.bin().value(d => d.y).thresholds(14)
    (data.filter(d => picked.has(d.id)));
  const hy = d3.scaleLinear().domain([0, d3.max(bins, b => b.length)]).range([c.h, 0]);
  const hg = c.g.append('g').attr('transform', 'translate(' + (gw + gap) + ',0)');
  hg.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
    .call(d3.axisBottom(d3.scaleLinear().domain(y.domain()).range([0, hw])).ticks(4).tickSizeOuter(0));
  hg.selectAll('rect').data(bins).join('rect')
    .attr('x', 1).attr('width', hw - 2)
    .attr('y', b => hy(b.length)).attr('height', b => c.h - hy(b.length))
    .attr('fill', '#16161a').attr('fill-opacity', 0.72);
  hg.append('text').attr('x', hw / 2).attr('y', -4).attr('text-anchor', 'middle')
    .style('font-size', '10px').style('fill', '#8a8a93')
    .text(L('已选 ' + picked.size + ' 个', picked.size + ' selected'));

  const brush = d3.brush().extent([[0, 0], [gw, c.h]]).on('end', function ({ selection }) {
    if (!selection) return;
    const [[x0, y0], [x1, y1]] = selection;
    picked = new Set(data.filter(d =>
      x(d.x) >= x0 && x(d.x) <= x1 && y(d.y) >= y0 && y(d.y) <= y1).map(d => d.id));
    d3.select(this).call(brush.move, null);
    draw();
  });
  c.g.append('g').attr('class', 'brush').call(brush)
    .call(b => b.select('.overlay').attr('cursor', 'crosshair'));

  /* 最小二乘趋势线 */
  const mx = d3.mean(data, d => d.x), my = d3.mean(data, d => d.y);
  const b1 = d3.sum(data, d => (d.x - mx) * (d.y - my)) / d3.sum(data, d => (d.x - mx) ** 2);
  const b0 = my - b1 * mx;
  c.g.append('line')
    .attr('x1', x(d3.min(data, d => d.x))).attr('y1', y(b0 + b1 * d3.min(data, d => d.x)))
    .attr('x2', x(d3.max(data, d => d.x))).attr('y2', y(b0 + b1 * d3.max(data, d => d.x)))
    .attr('stroke', '#16161a').attr('stroke-width', 1.4).attr('stroke-dasharray', '5 4');
}
draw();
</script>
</body>
</html>
