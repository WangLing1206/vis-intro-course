<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Treemap</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="d-controls" id="crumb"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(23);
const TREE = {
  name: 'root',
  children: [
    { zh: '存储', en: 'Storage', children: null },
    { zh: '计算', en: 'Compute', children: null },
    { zh: '网络', en: 'Network', children: null },
    { zh: '安全', en: 'Security', children: null }
  ]
};
const SUBS = [
  [['对象存储', 'Object'], ['块存储', 'Block'], ['归档', 'Archive'], ['缓存', 'Cache'], ['备份', 'Backup']],
  [['容器', 'Container'], ['虚拟机', 'VM'], ['函数计算', 'Serverless'], ['GPU', 'GPU'], ['调度', 'Scheduler']],
  [['负载均衡', 'LB'], ['CDN', 'CDN'], ['专线', 'Dedicated'], ['DNS', 'DNS'], ['防火墙', 'WAF']],
  [['身份认证', 'IAM'], ['密钥', 'KMS'], ['审计', 'Audit'], ['加密', 'Crypto'], ['风控', 'Risk']]
];
TREE.children.forEach(function (c, i) {
  c.children = SUBS[i].map(s => ({ zh: s[0], en: s[1], value: Math.round(20 + R() * 160) }));
});

let current = null;
document.getElementById('hint').innerHTML =
  L('<b>提示：</b>树图用面积编码数值、用嵌套表达层级，擅长回答"谁最大"。点击色块下钻，点击顶部面包屑返回。',
    '<b>Tip:</b> a treemap encodes value by area and hierarchy by nesting, ideal for "which is largest". Click a tile to drill down and the breadcrumb to go back.');

function nameOf(d) {
  const n = d.data.name || (window.DEMO_LANG === 'en' ? d.data.en : d.data.zh);
  return n;
}

function draw(node) {
  current = node;
  const c = canvas('#chart', 268, { top: 18, right: 4, bottom: 4, left: 4 });
  const root = d3.hierarchy(node).sum(d => d.value || 0)
    .sort((a, b) => b.value - a.value);
  d3.treemap().size([c.w, c.h]).paddingTop(18).paddingInner(2).round(true)(root);

  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';
  const trail = [];
  for (let n = root; n; n = n.parent) trail.unshift(n);
  trail.forEach(function (n, i) {
    const b = document.createElement('button');
    b.className = 'd-btn';
    b.textContent = (i === 0 ? '' : '› ') + (i === 0 ? L('全部', 'All') : nameOf(n));
    b.onclick = function () { draw(n.data === TREE ? TREE : n.data); };
    crumb.appendChild(b);
  });

  const color = d3.scaleOrdinal().domain(root.children.map(d => nameOf(d)))
    .range(['#4f46e5', '#0f766e', '#f59e0b', '#be185d', '#6366f1', '#0891b2']);
  const T = window.tip('.wrap');

  const cells = c.g.selectAll('g.cell').data(root.children).join('g')
    .attr('class', 'cell')
    .attr('transform', d => 'translate(' + d.x0 + ',' + d.y0 + ')')
    .style('cursor', 'pointer');

  cells.append('rect')
    .attr('width', d => Math.max(d.x1 - d.x0, 0))
    .attr('height', d => Math.max(d.y1 - d.y0, 0))
    .attr('fill', d => color(nameOf(d)))
    .attr('fill-opacity', 0.9)
    .attr('rx', 2)
    .attr('stroke', '#fff').attr('stroke-width', 1);

  cells.append('text')
    .attr('x', 6).attr('y', 15)
    .style('font-size', '11px').style('fill', '#fff').style('font-weight', 600)
    .text(d => nameOf(d))
    .style('pointer-events', 'none');

  cells.append('text')
    .attr('x', 6).attr('y', 29)
    .style('font-size', '10px').style('fill', 'rgba(255,255,255,.8)')
    .text(d => d.value + (d.children ? ' · ' + d.children.length + ' ' + L('项', 'items') : ''))
    .style('pointer-events', 'none');

  cells.on('mouseover', function (e, d) {
    T.show('<b>' + nameOf(d) + '</b><br>' + L('数值', 'value') + ' ' + d.value, e);
  }).on('mousemove', e => T.move(e)).on('mouseout', () => T.hide())
    .on('click', function (e, d) { if (d.children) draw(d.data); });
}
draw(TREE);
</script>
</body>
</html>
