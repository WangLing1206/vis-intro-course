<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Streamgraph</title>
<link rel="stylesheet" href="demo.css">
<script src="../assets/js/vendor/d3.min.js"></script>
<script src="demo.js"></script>
</head>
<body>
<div class="wrap">
  <div class="legend" id="legend"></div>
  <div id="chart"></div>
  <p class="d-hint" id="hint"></p>
</div>
<script>
const R = window.rnd(61);
const KEYS = [
  ['直接访问', 'Direct'], ['搜索', 'Search'], ['社交', 'Social'],
  ['邮件', 'Email'], ['广告', 'Ads']
];
const color = d3.scaleOrdinal().range(['#4f46e5', '#6366f1', '#0f766e', '#f59e0b', '#be185d']);
const dates = d3.range(30).map(i => new Date(2025, 0, i + 1));

const data = dates.map(function (d, i) {
  const row = { date: d };
  KEYS.forEach(function (k, ki) {
    row[k[0]] = Math.max(4, 30 * Math.exp(-Math.pow((i - (6 + ki * 5)) / 7, 2)) + R() * 16);
  });
  return row;
});
const hidden = new Set();

const legendEl = document.getElementById('legend');
KEYS.forEach(function (k) {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = '<span class="swatch" style="background:' + color(k[0]) + '"></span>' +
    '<span>' + k[window.DEMO_LANG === 'en' ? 1 : 0] + '</span>';
  item.onclick = function () {
    if (hidden.has(k[0])) hidden.delete(k[0]); else hidden.add(k[0]);
    this.classList.toggle('off', hidden.has(k[0]));
    draw();
  };
  legendEl.appendChild(item);
});

document.getElementById('hint').innerHTML =
  L('<b>提示：</b>河流图用堆叠面积的厚度表达构成随时间的变化，基线居中可减少读取偏差。点击图例切换序列，鼠标移入查看当日构成。',
    '<b>Tip:</b> a streamgraph shows composition over time through band thickness, with a centered baseline that reduces reading bias. Click the legend to toggle series, hover to read daily composition.');

function draw() {
  const c = canvas('#chart', 248, { top: 12, right: 14, bottom: 24, left: 34 });
  const keys = KEYS.map(k => k[0]).filter(k => !hidden.has(k));
  if (!keys.length) return;

  const stack = d3.stack().keys(keys)
    .offset(d3.stackOffsetWiggle).order(d3.stackOrderInsideOut)
    .value((d, k) => d[k]);
  const series = stack(data);

  const x = d3.scaleTime().domain(d3.extent(dates)).range([0, c.w]);
  const y = d3.scaleLinear()
    .domain([d3.min(series, s => d3.min(s, d => d[0])), d3.max(series, s => d3.max(s, d => d[1]))])
    .range([c.h, 0]);

  c.g.append('g').attr('class', 'axis').attr('transform', 'translate(0,' + c.h + ')')
    .call(d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat(L('%-m/%-d', '%b %-d'))).tickSizeOuter(0));
  c.g.append('g').attr('class', 'axis').call(d3.axisLeft(y).ticks(4).tickSizeOuter(0));

  const area = d3.area()
    .x(d => x(d.data.date)).y0(d => y(d[0])).y1(d => y(d[1]))
    .curve(d3.curveBasis);

  c.g.selectAll('path.layer').data(series).join('path')
    .attr('class', 'layer').attr('d', area)
    .attr('fill', d => color(d.key)).attr('fill-opacity', 0.88)
    .attr('stroke', '#fff').attr('stroke-width', 0.6);

  const T = window.tip('.wrap');
  const focus = c.g.append('line').attr('y1', 0).attr('y2', c.h)
    .attr('stroke', '#16161a').attr('stroke-opacity', 0.4)
    .attr('stroke-dasharray', '3 3').style('display', 'none');

  c.g.append('rect').attr('width', c.w).attr('height', c.h).attr('fill', 'transparent')
    .on('mouseover', () => focus.style('display', null))
    .on('mouseout', () => { focus.style('display', 'none'); T.hide(); })
    .on('mousemove', function (e) {
      const mx = d3.pointer(e)[0];
      const date = x.invert(mx);
      const i = d3.bisector(d => d.date).center(dates, date);
      focus.attr('x1', x(dates[i])).attr('x2', x(dates[i]));
      const label = d3.timeFormat(L('%Y年%-m月%-d日', '%b %-d, %Y'))(dates[i]);
      T.show('<b>' + label + '</b><br>' + keys.map(function (k) {
        const item = KEYS.find(m => m[0] === k);
        return item[window.DEMO_LANG === 'en' ? 1 : 0] + ' ' + fmt(data[i][k], 1);
      }).join('<br>'), e);
    });
}
draw();
</script>
</body>
</html>
